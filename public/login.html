<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accedi — Bike Training Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/auth.js"></script>
</head>

<body>
    <header>
        <div class="container">
            <div class="logo"><i class="fa-solid fa-person-biking"></i> <a href="index.html">Bike Training Manager</a>
            </div>
            <button class="menu-toggle" id="menuToggle" aria-label="Apri menu"><i class="fa-solid fa-bars"></i></button>
            <nav>
                <ul id="mainNav">
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                    <li><a href="login.html" class="active"><i class="fa-solid fa-right-to-bracket"></i> Accedi</a></li>
                    <li><a href="register.html"><i class="fa-solid fa-user-plus"></i> Registrati</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="auth-container">
            <div class="card">
                <h1><i class="fa-solid fa-right-to-bracket"></i> Accedi al tuo account</h1>
                <div id="alertContainer"></div>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
                        <input type="email" id="email" name="email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" id="password" name="password" class="form-control" required
                            minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block"><i class="fa-solid fa-right-to-bracket"></i>
                        Accedi</button>
                </form>
                <div class="auth-link">
                    Non hai un account? <a href="register.html"><i class="fa-solid fa-user-plus"></i> Registrati</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Bike Training Manager &mdash; Progetto Programmazione Web</p>
        </div>
    </footer>
</body>

</html>
