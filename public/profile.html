<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profilo — Bike Training Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="js/auth.js"></script>
    <script defer src="js/profile.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo"><i class="fa-solid fa-person-biking"></i> <a href="dashboard.html">Bike Training Manager</a></div>
            <button class="menu-toggle" id="menuToggle" aria-label="Apri menu"><i class="fa-solid fa-bars"></i></button>
            <nav>
                <ul id="mainNav">
                    <li><a href="dashboard.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
                    <li><a href="trainings.html"><i class="fa-solid fa-person-biking"></i> Allenamenti</a></li>
                    <li><a href="statistics.html"><i class="fa-solid fa-chart-line"></i> Statistiche</a></li>
                    <li><a href="profile.html" class="active"><i class="fa-solid fa-user"></i> Profilo</a></li>
                    <li><a href="#" id="logoutLink"><i class="fa-solid fa-right-from-bracket"></i> Esci</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h1 class="page-title"><i class="fa-solid fa-user"></i> Profilo</h1>
            <p class="page-subtitle">Gestisci le tue informazioni personali</p>

            <div id="profileAlert"></div>

            <div class="card">
                <div class="card-title"><i class="fa-solid fa-id-card"></i> Dati personali</div>
                <form id="profileForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pFirstName"><i class="fa-solid fa-user"></i> Nome</label>
                            <input type="text" id="pFirstName" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="pLastName"><i class="fa-solid fa-user"></i> Cognome</label>
                            <input type="text" id="pLastName" class="form-control" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="pEmail"><i class="fa-solid fa-envelope"></i> Email</label>
                        <input type="email" id="pEmail" class="form-control" readonly>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="pWeight"><i class="fa-solid fa-weight-scale"></i> Peso (kg)</label>
                            <input type="number" id="pWeight" class="form-control" step="0.1" min="0">
                        </div>
                        <div class="form-group">
                            <label for="pHeight"><i class="fa-solid fa-ruler-vertical"></i> Altezza (cm)</label>
                            <input type="number" id="pHeight" class="form-control" step="0.1" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="pDiscipline"><i class="fa-solid fa-person-biking"></i> Disciplina preferita</label>
                        <select id="pDiscipline" class="form-control">
                            <option value="MTB">MTB</option>
                            <option value="strada">Strada</option>
                            <option value="gravel">Gravel</option>
                            <option value="indoor">Indoor</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Salva modifiche</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title"><i class="fa-solid fa-key"></i> Cambia password</div>
                <form id="passwordForm">
                    <div class="form-group">
                        <label for="oldPassword"><i class="fa-solid fa-lock"></i> Password attuale</label>
                        <input type="password" id="oldPassword" class="form-control" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="newPassword"><i class="fa-solid fa-lock"></i> Nuova password</label>
                        <input type="password" id="newPassword" class="form-control" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirmNewPassword"><i class="fa-solid fa-lock"></i> Conferma nuova password</label>
                        <input type="password" id="confirmNewPassword" class="form-control" required minlength="6">
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-key"></i> Cambia password</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title"><i class="fa-solid fa-right-from-bracket"></i> Esci dall'applicazione</div>
                <p style="margin-bottom:12px;color:#6C757D;">Effettua il logout dalla piattaforma.</p>
                <button id="logoutBtn" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Bike Training Manager &mdash; Progetto Programmazione Web</p>
        </div>
    </footer>
</body>
</html>
